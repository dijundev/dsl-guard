name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Import from installed package
        # 单独跑一次：确认包不是靠仓库根目录的相对路径才 import 得到的
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import dslguard; print('dslguard', dslguard.__version__)"
          python -c "import dslguard; assert dslguard.guard('SELECT 1 FROM t').ok"
